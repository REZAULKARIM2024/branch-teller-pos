name: CI

# Builds the project and runs the JUnit test suite on every push and PR. The GL/interest/
# approval tests run against an in-memory H2 database, so no MySQL service container is
# needed here -- that keeps this pipeline fast and self-contained.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and run tests
        run: mvn -B verify

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

      - name: Publish Cucumber HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: target/cucumber-report/
          if-no-files-found: ignore

      # allure-junit5 / allure-cucumber7-jvm already write raw results to
      # target/allure-results during `mvn verify` above -- this turns them into
      # the same browsable static site `mvn allure:report` produces locally
      # (target/site/allure-maven-plugin), then publishes that folder straight
      # to the gh-pages branch so the report is viewable at
      # https://<user>.github.io/<repo>/ without anyone needing Maven installed
      # locally. (No cross-run trend history -- keeping this to the one
      # already-proven command avoids the flakiness of chaining extra
      # community actions just for trend charts.)
      - name: Build Allure report
        if: always()
        continue-on-error: true
        run: mvn -B io.qameta.allure:allure-maven:2.15.2:report

      # Guards the publish step below: peaceiris/actions-gh-pages fails with a confusing
      # "src refspec gh-pages does not match any" error if publish_dir doesn't exist or
      # is empty (nothing to commit), instead of a clear message -- so check first and
      # surface a real warning if the report step above didn't actually produce anything.
      - name: Check Allure report was generated
        if: always()
        id: allure_check
        run: |
          if [ -f target/site/allure-maven-plugin/index.html ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::target/site/allure-maven-plugin/index.html was not created -- see the 'Build Allure report' step's log above for the actual error. Skipping GitHub Pages publish."
          fi

      - name: Publish Allure report to GitHub Pages
        if: always() && steps.allure_check.outputs.exists == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: target/site/allure-maven-plugin
