name: CI

# Builds the project and runs the JUnit test suite on every push and PR. The GL/interest/
# approval tests run against an in-memory H2 database, so no MySQL service container is
# needed here -- that keeps this pipeline fast and self-contained.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and run tests
        run: mvn -B verify

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

      - name: Publish Cucumber HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: target/cucumber-report/
          if-no-files-found: ignore

      # allure-junit5 / allure-cucumber7-jvm already write raw results to
      # target/allure-results during `mvn verify` above -- these two steps turn
      # them into a browsable static site and publish it to GitHub Pages, so the
      # report is viewable at https://<user>.github.io/<repo>/ without anyone
      # needing Maven installed locally. history/ carries trend charts forward
      # across runs by pulling the previous report off the gh-pages branch first.
      - name: Load previous report history
        if: always()
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Build Allure report
        if: always()
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: target/allure-results
          allure_history: allure-history
          gh_pages: gh-pages
          keep_reports: 20

      - name: Publish Allure report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
