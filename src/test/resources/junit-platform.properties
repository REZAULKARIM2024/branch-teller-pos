# QA finding: this suite had NO explicit test ordering configured, so JUnit 5 fell back to its
# documented "deterministic, but intentionally non-obvious" default order for both test classes
# and test methods within a class. That default is derived from JVM-internal method/class
# enumeration (essentially Class.getDeclaredMethods() order), which the JLS/JVM spec does NOT
# guarantee to be stable across different JVM vendors, versions, or operating systems -- only
# that it's stable for a given JVM build running the same bytecode.
#
# Concretely: the user's local Windows Maven run and GitHub Actions CI's Ubuntu/Temurin-17 run
# are two different JVM environments, so they were free to execute this shared-H2-database test
# suite's ~280 tests in two DIFFERENT orders. Every individual GL posting in this codebase is
# correctly balanced and atomically transaction-wrapped (verified across BankingService,
# InterestService, LoanService, PaymentsService, PayrollService, and every test file that seeds
# gl_entries directly), so no ordering should ever produce a real imbalance -- but pinning the
# order removes JVM/OS nondeterminism as a variable entirely, so any future environment-specific
# failure becomes reproducible locally instead of only surfacing in CI.
#
# ClassName/MethodName orderers sort by the class/method's literal name string, which is fully
# deterministic and identical on every OS and JVM vendor -- unlike the unspecified default.
junit.jupiter.testclass.order.default=org.junit.jupiter.api.ClassOrderer$ClassName
junit.jupiter.testmethod.order.default=org.junit.jupiter.api.MethodOrderer$MethodName
